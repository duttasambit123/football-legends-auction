function sqp(me){const v=G.T[VW]||me;return `<div class='pn'><div class='mu'>Squads · tap a club to see who it signed</div><div>${G.T.map((t,i)=>`<button class='s' style='padding:4px 10px;margin:2px;${t===v?'border-color:var(--gd);color:var(--gd)':''}' data-v='${i}'>${t.n}${t===me?' (you)':''}</button>`).join('')}</div><p><b>${v.n}</b> · ${v.sq.length} players · purse ${v.b} FC</p>${v.sq.map(x=>`<span class='chip'>${x.p} ${x.n} ${x.o}${(v.pd||{})[x.n]?' · '+v.pd[x.n]+' FC':''}</span>`).join('')||`<span class='mu'>Nobody signed yet</span>`}</div>`}
function wv(){document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{VW=+b.dataset.v;render()})}
function quit(){PZ=0;VW=-1;clearInterval(iv);clearInterval(lt);if(RM)RM.leave();RM=null;HO=0;G=null;LOBV=null;ME=null;setup()}
setup();
</script></body></html>
